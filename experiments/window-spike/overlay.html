<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      #status {
        position: absolute;
        left: 20px;
        bottom: 20px;
        color: white;
        background: #18252de6;
        padding: 12px;
        font: 14px sans-serif;
        white-space: pre-line;
      }
    </style>
  </head>
  <body>
    <canvas></canvas>
    <div id="status"></div>
    <script>
      const canvas = document.querySelector('canvas');
      const context = canvas.getContext('2d');
      window.spike.onFrame((frame) => {
        canvas.width = innerWidth * devicePixelRatio;
        canvas.height = innerHeight * devicePixelRatio;
        context.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
        context.lineWidth = 3;
        context.font = '13px sans-serif';
        for (const ledge of frame.ledges) {
          context.strokeStyle = ledge.fast ? '#ff5263' : '#43f59c';
          context.fillStyle = context.strokeStyle;
          context.beginPath();
          context.moveTo(ledge.left, ledge.y);
          context.lineTo(ledge.right, ledge.y);
          context.stroke();
          context.fillText(ledge.label, ledge.left + 3, ledge.y + 18);
        }
        document.getElementById('status').textContent = frame.status;
        requestAnimationFrame(() => window.spike.painted(frame.sequence));
      });
    </script>
  </body>
</html>
