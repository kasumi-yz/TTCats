[project]
name = "ttcats-asset-factory"
version = "0.1.0"
description = "TTCats 半手动素材工厂"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy>=2.2,<3", "pillow>=11,<13", "pydantic>=2.11,<3", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
gpu = ["onnxruntime-gpu[cuda,cudnn]>=1.26,<1.27"]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.11,<1",
  "ffmpeg-binaries==1.1.0; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[project.scripts]
asset-factory = "asset_factory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asset_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
